<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111f" />
  <meta name="robots" content="noindex, follow" />
  <title>Mensagem enviada • Rovix Automation</title>
  <link rel="icon" type="image/png" href="./public/favicon.png" />
  <link rel="apple-touch-icon" href="./public/favicon.png" />
  <style>
    :root{
      --bg:#050b15;
      --panel:#111f35;
      --text:#eef6ff;
      --muted:#9db2d0;
      --blue:#1e73ff;
      --red:#ed1c24;
      --line:rgba(255,255,255,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Inter,Segoe UI,Arial,sans-serif;
      background:
        radial-gradient(circle at 20% 0%,rgba(30,115,255,.22),transparent 38%),
        radial-gradient(circle at 80% 12%,rgba(237,28,36,.18),transparent 30%),
        var(--bg);
      color:var(--text);
      text-align:center;
    }
    .box{
      width:min(620px,100%);
      padding:44px 32px;
      border-radius:28px;
      background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.03));
      border:1px solid var(--line);
      box-shadow:0 24px 80px rgba(0,0,0,.35);
    }
    img{
      width:88px;
      height:88px;
      object-fit:contain;
      border-radius:18px;
      margin-bottom:20px;
    }
    .check{
      width:64px;
      height:64px;
      border-radius:50%;
      display:grid;
      place-items:center;
      margin:0 auto 20px;
      background:linear-gradient(135deg,var(--blue),var(--red));
      font-size:34px;
      font-weight:900;
    }
    h1{
      margin:0 0 14px;
      font-size:clamp(32px,5vw,48px);
      line-height:1.05;
    }
    p{
      margin:8px auto;
      color:var(--muted);
      font-size:18px;
      line-height:1.6;
      max-width:480px;
    }
    a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-top:26px;
      padding:14px 22px;
      border-radius:14px;
      text-decoration:none;
      font-weight:800;
      color:#fff;
      background:linear-gradient(135deg,var(--blue),var(--red));
    }
  </style>
  <script>
    setTimeout(function(){
      window.location.href = "https://www.rovixautomation.com.br";
    }, 6000);
  </script>
</head>
<body>
  <main class="box">
    <img src="./public/logo.png" alt="Rovix Automation" />
    <div class="check">✓</div>
    <h1>Mensagem enviada!</h1>
    <p>Sua mensagem foi enviada para a Rovix Automation com sucesso.</p>
    <p>Em breve entraremos em contato.</p>
    <a href="https://www.rovixautomation.com.br">Voltar para o site</a>
  </main>
</body>
</html>
