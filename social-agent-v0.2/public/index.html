<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROVIX Social Agent</title><link rel="stylesheet" href="/styles.css"></head><body>
<aside class="sidebar"><div class="brand"><div class="mark">R</div><div><b>ROVIX</b><span>SOCIAL AGENT</span></div></div><nav>
<button class="nav active" data-view="dashboard">▦ <span>Visão Geral</span></button><button class="nav" data-view="create">✦ <span>Criar Post</span></button><button class="nav" data-view="queue">✓ <span>Aprovações</span></button><button class="nav" data-view="calendar">▣ <span>Calendário</span></button><button class="nav" data-view="projects">◈ <span>Projetos</span></button><button class="nav" data-view="settings">⚙ <span>Instagram</span></button></nav><div class="founder">ROVIX Automation<br><small>by Roberto Justino</small><br><small>V0.2 ONLINE</small></div></aside>
<main><header><div><p class="eyebrow">CENTRAL DE CONTEÚDO</p><h1 id="pageTitle">Visão Geral</h1></div><div id="metaBadge" class="badge">Verificando Instagram…</div></header><section id="content"></section></main>
<template id="dashboardTpl"><div class="cards" id="statCards"></div><div class="panel"><div class="panel-head"><div><span class="kicker">FILA EDITORIAL</span><h2>Conteúdo recente</h2></div><button class="primary" onclick="go('create')">+ Criar post</button></div><div id="recentPosts"></div></div></template>
<template id="createTpl"><div class="panel form-panel"><span class="kicker">NOVO CONTEÚDO</span><h2>Criar rascunho</h2><form id="postForm" class="form-grid"><label>Projeto<select id="projectId"></select></label><label>Título<input id="title" required></label><label class="wide">Legenda<textarea id="caption" rows="7" required></textarea></label><label class="wide">Imagem do post<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp"><small class="muted">A imagem será hospedada pelo serviço online antes de publicar.</small></label><label class="wide">Ou URL pública HTTPS<input id="imageUrl" type="url" placeholder="https://.../imagem.jpg"></label><label>Agendar para<input id="scheduledAt" type="datetime-local"></label><div class="actions"><button class="primary" type="submit">Salvar rascunho</button></div></form></div></template>
<template id="settingsTpl"><div class="panel"><span class="kicker">INTEGRAÇÃO OFICIAL</span><h2>Instagram / Meta</h2><div class="notice"><b>Credenciais somente no servidor.</b><p>O token nunca é exibido no navegador.</p></div><div id="settingsStatus"></div><div class="actions" style="margin-top:18px"><button id="testMeta" class="primary">Testar conexão agora</button></div></div></template>
<script src="/app.js"></script></body></html>
