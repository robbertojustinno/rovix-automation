name: ROVIX Social Agent tests
on:
  push:
    branches:
      - feature/rovix-drive-store-v1
    paths:
      - "portal-api/**"
      - ".github/workflows/rovix-social-agent-tests.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal-api/package-lock.json
      - run: npm ci
      - run: npm test
