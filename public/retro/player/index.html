<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROVIX Retro Player</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050509;color:#ddd;font-family:system-ui,sans-serif}#game{width:100%;height:100%;overflow:hidden;position:relative}#message{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:22px;color:#bfb0d0;pointer-events:none}</style></head><body><div id="game"></div><div id="message">Preparando o emulador…</div><script>
'use strict';
let launched=false;
const status=document.getElementById('message');
function report(type,message){try{parent.postMessage({source:'rovix-retro-player',type,message},location.origin)}catch{}}
window.addEventListener('message',event=>{
 if(event.origin!==location.origin||event.source!==parent||launched)return;
 const data=event.data;
 if(!data||data.source!=='rovix-retro-parent'||data.type!=='launch'||!(data.file instanceof Blob)||!['segaMD','snes','atari2600','arcade'].includes(data.core))return;
 launched=true;
 status.textContent='Carregando '+String(data.file.name||'jogo')+'…';
 window.EJS_player='#game';
 window.EJS_core=data.core;
 window.EJS_controlScheme=data.core;
 window.EJS_gameUrl=data.file;
 window.EJS_pathtodata='https://cdn.emulatorjs.org/4.2.3/data/';
 window.EJS_startOnLoaded=true;
 window.EJS_volume=.6;
 window.EJS_threads=false;
 window.EJS_defaultOptions={'save-state-location':'download'};
 window.EJS_Buttons={playPause:true,restart:true,mute:true,settings:true,volume:true,saveState:true,loadState:true,gamepad:true,fullscreen:true};
 window.EJS_onGameStart=()=>{status.remove();report('started','Jogo iniciado. Som e controles disponíveis conforme compatibilidade da ROM.')};
 const script=document.createElement('script');script.src=window.EJS_pathtodata+'loader.js';script.async=true;
 script.onerror=()=>{status.textContent='Falha ao carregar o emulador.';report('error','Não foi possível carregar o emulador.');};
 document.body.appendChild(script);
});
parent.postMessage({source:'rovix-retro-player',type:'ready'},location.origin);
</script></body></html>
